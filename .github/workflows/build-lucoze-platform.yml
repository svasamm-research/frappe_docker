# Build the Lucoze PLATFORM image (the 8-app monorepo svasamm-research/lucoze) and push to Docker Hub.
#
# Self-contained (does NOT reuse build-custom-image.yml) because the platform is a monorepo that needs a
# bespoke Containerfile (images/lucoze-platform/Containerfile) which clones the repo + get-apps its 8
# subdir apps. Auth uses the SVASAMM GitHub App (short-lived installation token) to clone the private repo.
#
# TRIGGER: workflow_dispatch. Pick channel = uat | production and pass the monorepo ref.
#   UAT:        channel=uat        version=uat-v1.0.0   ref=develop (or a uat tag)   → :uat-* + :uat-latest
#   Production: channel=production version=v1.0.0        ref=v1.0.0 (git tag)         → :v* + :latest
#
# Required GitHub Secrets:  DOCKERHUB_USERNAME · DOCKERHUB_TOKEN · SVASAMM_APP_PRIVATE_KEY
#                           DOKPLOY_LUCOZE_PLATFORM_WEBHOOK (prod) · DOKPLOY_LUCOZE_PLATFORM_UAT_WEBHOOK (uat)
# Required GitHub Variables: SVASAMM_APP_ID · DOKPLOY_DEPLOY_ENABLED ("true" to auto-deploy)

name: Build lucoze-platform

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "uat or production"
        required: true
        type: choice
        options: [uat, production]
      version:
        description: "Image version tag (uat-vX.Y.Z for uat, vX.Y.Z for production)"
        required: true
        type: string
      ref:
        description: "Monorepo git ref to build (branch or tag, e.g. develop or v1.0.0)"
        required: true
        type: string
        default: develop

env:
  FRAPPE_BRANCH: v16.20.0
  IMAGE_NAME: frappe-lucoze-platform
  MONOREPO: svasamm-research/lucoze

jobs:
  build:
    name: Build & push (${{ github.event.inputs.channel }})
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.pinned }}
    steps:
      - name: Validate version format
        run: |
          V="${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.channel }}" = "production" ]; then
            echo "$V" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "prod version must be vX.Y.Z"; exit 1; }
          else
            echo "$V" | grep -qE '^uat-v[0-9]+\.[0-9]+\.[0-9]+' || { echo "uat version must be uat-vX.Y.Z"; exit 1; }
          fi

      - name: Checkout frappe_docker
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SVASAMM_APP_ID }}
          private-key: ${{ secrets.SVASAMM_APP_PRIVATE_KEY }}
          owner: svasamm-research

      - name: Resolve tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          PREFIX="${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.channel }}" = "production" ]; then FLOAT=latest; else FLOAT=uat-latest; fi
          echo "mutable=${BASE}:${PREFIX}"             >> "$GITHUB_OUTPUT"
          echo "pinned=${BASE}:${PREFIX}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "floating=${BASE}:${FLOAT}"            >> "$GITHUB_OUTPUT"
          echo "cache=${BASE}:buildcache-${FLOAT}"    >> "$GITHUB_OUTPUT"

      - name: Encode upstream apps.json
        id: appsjson
        run: echo "b64=$(base64 -w 0 apps/lucoze-platform.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/lucoze-platform/Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.mutable }}
            ${{ steps.tags.outputs.pinned }}
            ${{ steps.tags.outputs.floating }}
          build-args: |
            FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}
            APPS_JSON_BASE64=${{ steps.appsjson.outputs.b64 }}
            LUCOZE_REPO=https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ env.MONOREPO }}
            LUCOZE_BRANCH=${{ github.event.inputs.ref }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max

      - name: Summary
        run: |
          {
            echo "### lucoze-platform image pushed"
            echo "- channel: \`${{ github.event.inputs.channel }}\`"
            echo "- version: \`${{ github.event.inputs.version }}\` (ref \`${{ github.event.inputs.ref }}\`)"
            echo "- pinned: \`${{ steps.tags.outputs.pinned }}\`"
            echo "- floating: \`${{ steps.tags.outputs.floating }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger Dokploy redeploy
    needs: build
    runs-on: ubuntu-latest
    if: vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    steps:
      - name: Redeploy bench
        env:
          WEBHOOK_URL: ${{ github.event.inputs.channel == 'production' && secrets.DOKPLOY_LUCOZE_PLATFORM_WEBHOOK || secrets.DOKPLOY_LUCOZE_PLATFORM_UAT_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "webhook not set — skipping deploy"; exit 0; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] && echo "deploy triggered ($CODE)" || { echo "webhook HTTP $CODE"; exit 1; }
