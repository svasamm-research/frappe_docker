# Reusable workflow: builds any Svasamm custom Frappe image and pushes to Docker Hub.
# Each industry image (cafirm, retail, etc.) has its own caller workflow.
#
# Tags pushed per build:
#   1. :PREFIX            — mutable version tag   (e.g. :uat-v0.1.0)
#   2. :PREFIX-{sha7}     — immutable pinned tag  (e.g. :uat-v0.1.0-abc1234)
#   3. :FLOATING          — stable mutable tag    (e.g. :uat-latest)
#      Use this in your Dokploy env file (CUSTOM_TAG=uat-latest) so
#      deployments always pull the latest build without changing config.
#
# UAT caller pattern:
#   with:
#     image_name: frappe-cafirm
#     image_tag_prefix: uat-v0.1.0
#     floating_tag: uat-latest           # → always points to latest UAT build
#
# Production caller pattern:
#   with:
#     image_name: frappe-cafirm
#     image_tag_prefix: v1.0.0
#     floating_tag: latest               # → always points to latest production build

name: Build Custom Frappe Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Docker Hub image name without namespace (e.g. frappe-cafirm)"
      frappe_branch:
        required: false
        type: string
        default: "version-16"
        description: "Frappe framework branch to build on"
      image_tag_prefix:
        required: true
        type: string
        description: |
          Version tag applied to Docker Hub image.
            UAT:        "uat-v0.1.0"  → :uat-v0.1.0  + :uat-v0.1.0-{sha7}
            Production: "v1.0.0"      → :v1.0.0      + :v1.0.0-{sha7}
      floating_tag:
        required: false
        type: string
        default: ""
        description: |
          Stable mutable tag that always points to the latest build for this environment.
          Use this in Dokploy env (CUSTOM_TAG) so deploys auto-pull the newest image.
            UAT:        "uat-latest"
            Production: "latest"
          Leave empty to skip.
      app_id:
        required: false
        type: string
        default: ""
        description: |
          GitHub App ID for in-flight installation-token auth. Set this AND
          apps_json_path (and pass GH_APP_PRIVATE_KEY as secret) instead of
          APPS_JSON_BASE64 to avoid baking long-lived PAT credentials into
          a per-tenant secret. The workflow reads apps_json_path from the
          repo, mints a short-lived (~1h) installation token, swaps it into
          the URL pattern https://x-access-token:TOKEN@github.com/... and
          base64-encodes the result for the build-arg.
      apps_json_path:
        required: false
        type: string
        default: ""
        description: |
          Repo-relative path to the apps.json that the App-token path should
          read (e.g. apps/dms-uat.json). Only used when app_id is set.
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      APPS_JSON_BASE64:
        required: false
        description: |
          Base64-encoded apps.json with HTTPS+PAT credentials baked into URLs.
          Legacy auth path — leave empty if using the App-token path
          (inputs.app_id + secrets.GH_APP_PRIVATE_KEY).
      GH_APP_PRIVATE_KEY:
        required: false
        description: |
          PEM-encoded GitHub App private key. Used only when inputs.app_id
          is set. The org variable SVASAMM_APP_ID + org secret
          SVASAMM_APP_PRIVATE_KEY satisfy this contract.
    outputs:
      image_tag:
        description: "Immutable pinned tag (e.g. user/frappe-cafirm:v1.0.0-abc1234)"
        value: ${{ jobs.build.outputs.image_tag }}
      mutable_tag:
        description: "Mutable latest tag (e.g. user/frappe-cafirm:develop)"
        value: ${{ jobs.build.outputs.mutable_tag }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.pinned }}
      mutable_tag: ${{ steps.tags.outputs.mutable }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}"
          PREFIX="${{ inputs.image_tag_prefix }}"
          FLOATING="${{ inputs.floating_tag }}"

          # Version-specific tags (always created)
          echo "mutable=${BASE}:${PREFIX}"               >> "$GITHUB_OUTPUT"
          echo "pinned=${BASE}:${PREFIX}-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "cache=${BASE}:buildcache-${PREFIX}"      >> "$GITHUB_OUTPUT"

          # Floating tag (e.g. uat-latest) — use in Dokploy CUSTOM_TAG
          if [ -n "$FLOATING" ]; then
            echo "floating=${BASE}:${FLOATING}" >> "$GITHUB_OUTPUT"
          else
            echo "floating=" >> "$GITHUB_OUTPUT"
          fi

      # App-mode auth: mint short-lived installation token from the
      # SVASAMM GitHub App and rewrite the in-repo apps.json URLs to embed
      # it. Skips if inputs.app_id is empty (PAT-mode path below handles it).
      - name: Mint GitHub App installation token (App-mode)
        if: inputs.app_id != ''
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: svasamm-research

      - name: Build apps.json with App token (App-mode)
        if: inputs.app_id != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APPS_JSON_PATH: ${{ inputs.apps_json_path }}
        run: |
          if [ ! -f "$APPS_JSON_PATH" ]; then
            echo "ERROR: apps_json_path '$APPS_JSON_PATH' not found at repo root."
            exit 1
          fi
          jq --arg t "$GH_TOKEN" '
            map(.url |= (
              sub("^https://github.com/"; "https://x-access-token:\($t)@github.com/") |
              sub("^git\\+ssh://git@github.com/"; "https://x-access-token:\($t)@github.com/")
            ))
          ' "$APPS_JSON_PATH" | base64 -w 0 > /tmp/apps.b64
          {
            echo "APPS_JSON_BASE64<<EOF"
            cat /tmp/apps.b64
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      # PAT-mode auth (legacy, Lucoze + cafirm): copy the pre-built
      # APPS_JSON_BASE64 secret into env so the build-args reference is uniform.
      - name: Use APPS_JSON_BASE64 secret (PAT-mode)
        if: inputs.app_id == ''
        env:
          PAT_APPS_JSON_BASE64: ${{ secrets.APPS_JSON_BASE64 }}
        run: |
          if [ -z "$PAT_APPS_JSON_BASE64" ]; then
            echo "ERROR: neither inputs.app_id nor secrets.APPS_JSON_BASE64 supplied."
            echo "       One of the two auth paths must be wired."
            exit 1
          fi
          {
            echo "APPS_JSON_BASE64<<EOF"
            echo "$PAT_APPS_JSON_BASE64"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.mutable }}
            ${{ steps.tags.outputs.pinned }}
            ${{ steps.tags.outputs.floating }}
          build-args: |
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
            APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}
          # Separate cache per prefix keeps UAT and production layers independent
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max

      - name: Build summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Use for |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tags.outputs.mutable }}\` | Version tag (this release) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tags.outputs.pinned }}\`  | Pinned — immutable, tied to commit |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.tags.outputs.floating }}" ]; then
            echo "| \`${{ steps.tags.outputs.floating }}\` | Floating — use in Dokploy CUSTOM_TAG |" >> "$GITHUB_STEP_SUMMARY"
          fi
