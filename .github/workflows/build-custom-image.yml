# Reusable workflow: builds any Svasamm custom Frappe image and pushes to Docker Hub.
# Each industry image (cafirm, retail, etc.) has its own caller workflow.
#
# UAT caller pattern:
#   uses: ./.github/workflows/build-custom-image.yml
#   with:
#     image_name: frappe-cafirm
#     frappe_branch: version-16
#     image_tag_prefix: develop          # → :develop  and :develop-{sha7}
#   secrets: { DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, APPS_JSON_BASE64 }
#
# Production caller pattern:
#   uses: ./.github/workflows/build-custom-image.yml
#   with:
#     image_name: frappe-cafirm
#     frappe_branch: version-16
#     image_tag_prefix: v1.0.0           # → :v1.0.0  and :v1.0.0-{sha7}
#   secrets: { DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, APPS_JSON_BASE64 }

name: Build Custom Frappe Image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Docker Hub image name without namespace (e.g. frappe-cafirm)"
      frappe_branch:
        required: false
        type: string
        default: "version-16"
        description: "Frappe framework branch to build on"
      image_tag_prefix:
        required: true
        type: string
        description: |
          Tag prefix applied to all Docker Hub tags.
            UAT:        "develop"  → :develop  + :develop-{sha7}
            Production: "v1.0.0"  → :v1.0.0  + :v1.0.0-{sha7}
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      APPS_JSON_BASE64:
        required: true
        description: "Base64-encoded apps.json with actual repo credentials"
    outputs:
      image_tag:
        description: "Immutable pinned tag (e.g. user/frappe-cafirm:v1.0.0-abc1234)"
        value: ${{ jobs.build.outputs.image_tag }}
      mutable_tag:
        description: "Mutable latest tag (e.g. user/frappe-cafirm:develop)"
        value: ${{ jobs.build.outputs.mutable_tag }}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tags.outputs.pinned }}
      mutable_tag: ${{ steps.tags.outputs.mutable }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}"
          PREFIX="${{ inputs.image_tag_prefix }}"

          echo "mutable=${BASE}:${PREFIX}"               >> "$GITHUB_OUTPUT"
          echo "pinned=${BASE}:${PREFIX}-${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "cache=${BASE}:buildcache-${PREFIX}"      >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.mutable }}
            ${{ steps.tags.outputs.pinned }}
          build-args: |
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
            APPS_JSON_BASE64=${{ secrets.APPS_JSON_BASE64 }}
          # Separate cache per prefix keeps UAT and production layers independent
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max

      - name: Build summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Use for |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tags.outputs.mutable }}\` | Mutable latest (auto-updated) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.tags.outputs.pinned }}\`  | Pinned — paste this in Dokploy |" >> "$GITHUB_STEP_SUMMARY"
