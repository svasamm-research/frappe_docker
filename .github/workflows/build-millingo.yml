# Production build for the Millingo (rice-mill ERP) image.
#
# TRIGGER: workflow_dispatch only — called by the millingo repo when a Release tagged
#   vX.Y.Z (no `uat-` prefix) is published. Builds svasamm/millingo:vX.Y.Z +
#   :vX.Y.Z-{sha7} + :latest, apps cloned from `main`, then deploys via Dokploy webhook.
#
# AUTH: App-mode (same as dms/UAT) — the reusable workflow injects a short-lived SVASAMM
#   GitHub App token into the committed apps/millingo.json at build time. No base64 secret.
#
# Required GitHub Secrets (org-level): DOCKERHUB_USERNAME, DOCKERHUB_TOKEN,
#   SVASAMM_APP_PRIVATE_KEY. Per-tenant: DOKPLOY_MILLINGO_WEBHOOK.
# Required GitHub Variables (org-level): SVASAMM_APP_ID; DOKPLOY_DEPLOY_ENABLED = "true".

name: Build millingo — Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Production release tag (e.g. v1.0.0). Defaults to 'latest'."
        required: false
        default: "latest"
        type: string

jobs:
  build:
    name: Build svasamm/millingo (Production)
    uses: ./.github/workflows/build-custom-image.yml
    with:
      image_name: millingo
      frappe_branch: v16.17.0
      image_tag_prefix: ${{ github.event.inputs.version || 'latest' }}
      floating_tag: latest
      app_id: ${{ vars.SVASAMM_APP_ID }}
      apps_json_path: apps/millingo.json
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GH_APP_PRIVATE_KEY: ${{ secrets.SVASAMM_APP_PRIVATE_KEY }}

  deploy:
    name: Deploy to Production bench
    needs: build
    runs-on: ubuntu-latest
    if: vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_MILLINGO_WEBHOOK }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_MILLINGO_WEBHOOK not set — skipping deploy."
            exit 0
          fi
          echo "Deploying to Production bench — image: $IMAGE_TAG"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "Webhook returned HTTP $HTTP_STATUS"; exit 1
          fi
