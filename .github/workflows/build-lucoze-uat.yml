# UAT build for frappe-lucoze image.
#
# TRIGGER: workflow_dispatch only.
#   - Called automatically by lucoze when a Release tagged uat-vX.Y.Z is published.
#   - Can also be triggered manually (e.g. after infra changes on svasamm/base).
#
# Flow:
#   lucoze: create Release tagged uat-v1.2.0
#     → trigger-image-build.yml dispatches this workflow with version=uat-v1.2.0
#       → builds frappe-lucoze:uat-v1.2.0 + :uat-v1.2.0-{sha7} + :uat-latest
#         (apps cloned from uat branch)
#           → deploys to UAT bench via Dokploy webhook
#
# The floating tag :uat-latest always points to the newest UAT build.
# Use CUSTOM_TAG=uat-latest in your Dokploy env file — no config change needed per release.
#
# VERSION PINNING:
#   Upstream app versions are pinned in apps/lucoze-uat.json (release tags, not branches).
#   frappe_branch stays as version-16 because frappe/build Docker images are only published
#   per ERPNext release, not per Frappe release. Frappe is cloned at the branch tip during
#   bench init — minor drift is acceptable within the same major version.
#
#   After running `bench update` locally:
#     1. Update apps/lucoze-uat.json with the new version tags
#     2. Re-encode and update LUCOZE_UAT_APPS_JSON_BASE64 GitHub secret
#     3. Trigger a new build
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME              Docker Hub username
#   DOCKERHUB_TOKEN                 Docker Hub token (read+write)
#   LUCOZE_UAT_APPS_JSON_BASE64     base64 of apps/lucoze-uat.json with HTTPS+PAT URLs
#                                   (custom apps pointing to uat branch)
#   DOKPLOY_LUCOZE_UAT_WEBHOOK      Dokploy deploy webhook for UAT bench
#
# Required GitHub Variables:
#   DOKPLOY_DEPLOY_ENABLED          set to "true" to enable auto-deploy after build

name: Build lucoze — UAT

on:
  # Triggered by lucoze when a uat-vX.Y.Z release is published
  # (or manually via "Run workflow" button for infra rebuilds)
  workflow_dispatch:
    inputs:
      version:
        description: "UAT release tag (e.g. uat-v1.2.0). Defaults to 'uat-latest' for infra-triggered builds."
        required: false
        default: "uat-latest"
        type: string

jobs:
  build:
    name: Build frappe-lucoze (UAT)
    uses: ./.github/workflows/build-custom-image.yml
    with:
      image_name: frappe-lucoze
      frappe_branch: version-16
      image_tag_prefix: ${{ github.event.inputs.version || 'uat-latest' }}
      floating_tag: uat-latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      APPS_JSON_BASE64: ${{ secrets.LUCOZE_UAT_APPS_JSON_BASE64 }}

  deploy:
    name: Deploy to UAT bench
    needs: build
    runs-on: ubuntu-latest
    if: vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: uat

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_LUCOZE_UAT_WEBHOOK }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_LUCOZE_UAT_WEBHOOK not set — skipping deploy."
            exit 0
          fi

          echo "Deploying to UAT bench..."
          echo "Image: $IMAGE_TAG"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "Webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Deploy summary
        if: always()
        run: |
          echo "### UAT Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ github.event.inputs.version || 'uat-latest' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${{ needs.build.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bench**: lucoze UAT (Hetzner)" >> "$GITHUB_STEP_SUMMARY"
