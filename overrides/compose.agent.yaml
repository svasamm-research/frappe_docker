# overrides/compose.agent.yaml
#
# Option B (Central Traefik on Manager) — Agent-side bench configuration.
#
# Use this INSTEAD OF compose.dokploy.yaml when deploying benches on Agent VPSes.
#
# How Option B works:
#   - Manager VPS: single public IP, Traefik handles all SSL + routing
#   - Agent VPS:   no public HTTP/S; bench frontend exposed ONLY on private network
#   - Manager Traefik reads ~/gitops/traefik-routes.yaml (file provider) to know
#     which domains map to which Agent private IP + bench port
#
# Required env vars (add to cafirm.env):
#   AGENT_PRIVATE_IP  — Agent's Hetzner private network IP (e.g., 10.0.0.2)
#   BENCH_PORT        — Unique port for this bench on this agent (e.g., 8080)
#                       Each bench on the SAME agent needs a different port.
#                       Benches on DIFFERENT agents can share the same port.
#   ROUTER            — Unique bench identifier; becomes the bench Docker network name
#   DB_HOST           — mariadb-database
#   DB_PASSWORD       — must match mariadb.env DB_PASSWORD
#
# Generate bench compose file (run on local machine):
#   docker compose \
#     --env-file /tmp/cafirm.env \
#     -f compose.yaml \
#     -f overrides/compose.redis.yaml \
#     -f overrides/compose.agent.yaml \
#     config > /tmp/cafirm.yaml
#
# Then update ~/gitops/traefik-routes.yaml on the Manager to add routing for
# the new bench (SITES_RULE domains → AGENT_PRIVATE_IP:BENCH_PORT).

services:
  # ── Configurator ────────────────────────────────────────────────────────────
  # Runs once per deployment; all other services wait for it to complete.
  #
  # Asset pipeline explanation:
  #   bench build --production compiles JS/CSS into apps/[app]/[app]/public/dist/
  #   inside the configurator container's writable layer (ephemeral — gone on exit).
  #   bench then creates symlinks: sites/assets/[app] -> apps/[app]/[app]/public/
  #   These symlinks break in the frontend container because its apps/ layer has
  #   no compiled dist files (bench init does not run bench build).
  #
  #   Fix: after bench build, copy each app's public/ directory as real files into
  #   sites/assets/[app]/ (replacing the symlinks) inside the sites_assets volume.
  #   The volume is shared with the frontend container, which can then serve the
  #   compiled bundles directly without chasing symlinks across container boundaries.
  configurator:
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        echo "[deploy] Running bench build --production ...";
        bench build --production;
        echo "[deploy] Copying compiled assets into persistent volume ...";
        for app in $(ls apps); do
          pub="/home/frappe/frappe-bench/apps/$$app/$$app/public";
          if [ -d "$$pub" ]; then
            rm -rf "sites/assets/$$app";
            mkdir -p "sites/assets/$$app";
            cp -r "$$pub/." "sites/assets/$$app";
          fi;
        done;
        echo "[deploy] Assets ready.";
        echo "[deploy] Running migrations for all sites ...";
        for site in $$(ls sites/ | grep -vE "^assets$$|^apps.txt$$|^common_site_config.json$$"); do
          if [ -d "sites/$$site" ]; then
            echo "[deploy] Migrating $$site ...";
            bench --site $$site migrate || true;
          fi;
        done;
        echo "[deploy] Migrations done.";
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  # ── Application services ─────────────────────────────────────────────────────
  # All mount sites_assets so they share the same built frontend files.
  frontend:
    # Expose bench ONLY on private network. Manager Traefik connects here.
    # Format: AGENT_PRIVATE_IP:BENCH_PORT:CONTAINER_PORT
    ports:
      - "${AGENT_PRIVATE_IP}:${BENCH_PORT}:8080"
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network

  backend:
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  websocket:
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  scheduler:
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  queue-short:
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  queue-long:
    volumes:
      - sites_assets:/home/frappe/frappe-bench/sites/assets
    networks:
      - bench-network
      - mariadb-network

  # ── Redis services ───────────────────────────────────────────────────────────
  # The deploy-version label ties Redis to the app image tag. When CUSTOM_TAG
  # changes (new release), Docker Compose sees Redis as "changed" and recreates
  # these containers — ensuring they join the same bench-network as the new
  # bench services. Without this, Redis survives the redeploy unchanged and
  # stays attached to the old network object, causing DNS failures in workers.
  redis-cache:
    labels:
      com.frappe.deploy-version: ${CUSTOM_TAG:-latest}
    networks:
      - bench-network

  redis-queue:
    labels:
      com.frappe.deploy-version: ${CUSTOM_TAG:-latest}
    networks:
      - bench-network

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Named shared volume for compiled frontend assets.
  # Contains REAL FILES (not symlinks) copied from apps/[app]/public/ by the
  # configurator on each deploy. This is required because bench build writes
  # compiled dist files into the configurator container's writable layer
  # (ephemeral), and bench places symlinks in sites/assets/ pointing back to
  # apps/ — which breaks in the frontend container where apps/ has no compiled
  # dist files. Copying resolves the symlinks into actual files in this volume.
  sites_assets:

networks:
  # Shared MariaDB network — created once per agent in setup-agent.sh
  mariadb-network:
    name: mariadb-network
    external: true
  # Internal bench network — scoped to this bench only
  bench-network:
    name: ${ROUTER}
    external: false
